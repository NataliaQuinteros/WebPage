<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
<style>
  .notfound { min-height: 70vh; display: grid; place-content: center; text-align: center; gap: 1rem; }
  .notfound h1 { font-size: clamp(3rem, 12vw, 6rem); letter-spacing: -0.05em; }
  .notfound p { color: var(--ink-soft); margin: 0; }
</style>
</head>
<body>
  <main class="wrap notfound">
    <h1>404</h1>
    <p>That page does not exist.</p>
    <p><a class="btn" href="./">Back to the portfolio</a></p>
  </main>
</body>
</html>
